<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus v23.2 - Golden Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #06b6d4; --bg: #010409; }
        body { background: var(--bg); color: white; margin: 0; font-family: 'Inter', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* BOOT SEQUENCE */
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 30000; display: none; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; color: #06b6d4; }
        
        /* BLOQUEIO */
        #alpha-lock { position: fixed; inset: 0; background: var(--bg); z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .price-tag { background: linear-gradient(45deg, #06b6d4, #0891b2); color: #000; padding: 4px 14px; border-radius: 100px; font-size: 10px; font-weight: 900; margin-bottom: 12px; animation: pulse 2s infinite; }
        
        /* SCANNER */
        .scanning::after { content: ""; position: absolute; top: -100%; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent, var(--accent), transparent); opacity: 0.2; animation: scan 2s infinite; }
        @keyframes scan { 0% { top: -100%; } 100% { top: 100%; } }

        /* CHAT & UI */
        #chat-window { position: fixed; bottom: 100px; right: 20px; width: 340px; height: 520px; border-radius: 2.5rem; display: none; flex-direction: column; z-index: 4001; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 1.2rem; font-size: 11px; max-width: 85%; line-height: 1.5; animation: fadeInUp 0.3s ease; }
        .msg-ia { background: rgba(6, 182, 212, 0.05); border: 1px solid rgba(6, 182, 212, 0.1); align-self: flex-start; }
        .msg-user { background: #06b6d4; color: #000; font-weight: 700; align-self: flex-end; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-active { color: #06b6d4 !important; }
        .hidden { display: none !important; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="pb-32">

    <div id="toast" class="fixed top-[-100px] left-1/2 -translate-x-1/2 px-6 py-3 rounded-full bg-cyan-500 text-black text-[10px] font-black z-[30000] transition-all duration-500 uppercase">Sincronizado</div>

    <div id="boot-screen">
        <div id="boot-text" class="text-[10px] uppercase tracking-tighter w-64"></div>
    </div>

    <div id="alpha-lock" class="hidden text-center">
        <div class="price-tag uppercase italic">Nexus Alpha v23.2</div>
        <div class="w-20 h-20 bg-cyan-500/10 rounded-[2rem] flex items-center justify-center mb-8 border border-cyan-500/20 mx-auto text-3xl shadow-2xl">🔐</div>
        <h2 class="text-3xl font-black uppercase mb-2 tracking-tighter text-white">Chave Alpha</h2>
        <div class="glass p-6 rounded-[2.5rem] w-full max-w-xs mx-auto mb-6 border border-white/10">
            <input type="text" id="alpha-key" placeholder="NEXUS2026" class="w-full bg-transparent text-center text-xl font-black outline-none text-white uppercase tracking-widest">
        </div>
        <button onclick="verificarChave()" class="w-full max-w-xs bg-slate-100 text-slate-950 py-5 rounded-3xl font-black text-[11px] uppercase shadow-2xl active:scale-95 transition-all mb-8">Validar Acesso</button>
        <a href="https://wa.me/5511994025686?text=Quero+minha+chave+Alpha" class="text-cyan-500 font-black text-[10px] uppercase tracking-widest underline">Adquirir Chave (R$ 5,00)</a>
    </div>

    <div id="main-app" class="hidden h-screen flex flex-col">
        <header class="p-6 flex justify-between items-center border-b border-white/5 bg-black/50 backdrop-blur-md sticky top-0 z-50">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center font-black text-black">N</div>
                <div><h1 class="text-[11px] font-black uppercase tracking-widest">Sovereign</h1><p id="nexus-id-display" class="text-[8px] text-slate-500 font-mono">ID: NX-LOAD</p></div>
            </div>
            <div class="text-right">
                <p id="xp-display" class="text-xs font-black">0 XP</p>
                <div class="w-16 h-1 bg-white/10 rounded-full mt-1 overflow-hidden"><div id="xp-bar" class="h-full bg-cyan-500 transition-all duration-700 w-0"></div></div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-6">
            <div id="dash" class="tab-content active space-y-6">
                <div id="daily-mission" class="bg-gradient-to-r from-cyan-900/40 to-transparent p-5 rounded-[2rem] border border-cyan-500/20 flex justify-between items-center">
                    <div>
                        <p class="text-[8px] font-black text-cyan-400 uppercase tracking-widest">Missão do Dia</p>
                        <p class="text-[11px] font-bold text-white">Bater Meta de Água (3L)</p>
                    </div>
                    <button onclick="completeMission(this)" class="w-10 h-10 bg-cyan-500 rounded-xl text-black font-black text-xs">OK</button>
                </div>

                <div id="bio-card" class="glass p-8 rounded-[3rem] shadow-2xl relative overflow-hidden">
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                            <label class="text-[8px] font-black text-slate-500 uppercase italic">Peso (kg)</label>
                            <input id="u-weight" type="number" step="0.1" class="bg-transparent w-full text-2xl font-black outline-none text-white text-center mt-1">
                        </div>
                        <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                            <label class="text-[8px] font-black text-slate-500 uppercase italic">Meta</label>
                            <select id="u-meta" onchange="setMeta(this.value)" class="bg-transparent w-full text-[10px] font-black outline-none text-white uppercase mt-2">
                                <option value="Bulking">Bulking</option><option value="Cutting">Cutting</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="gerarProtocolo()" class="w-full bg-cyan-600 py-6 rounded-[2rem] font-black text-xs uppercase shadow-xl">Sincronizar Protocolo</button>
                </div>
                <div id="leaderboard" class="space-y-3"></div>
            </div>

            <div id="treinos" class="tab-content space-y-4 pb-20"><div id="lista-exercicios"></div></div>
            
            <div id="hub" class="tab-content pb-20">
                <div id="live-alert" class="text-[8px] font-black text-emerald-500 uppercase tracking-[0.3em] mb-4 animate-pulse">● NOVO MEMBRO ALPHA ENTROU NO SISTEMA</div>
                <div class="glass p-6 rounded-[2.5rem] space-y-4">
                    <textarea id="msg-input" placeholder="Relate o progresso..." class="w-full bg-white/5 p-6 rounded-[2rem] text-sm outline-none border border-white/10 h-32 text-white"></textarea>
                    <button onclick="postar()" class="w-full bg-purple-600 py-5 rounded-2xl font-black text-[10px] uppercase">Enviar ao Hub</button>
                    <div id="feed" class="mt-8 space-y-4"></div>
                </div>
            </div>
        </main>

        <button onclick="toggleChat()" class="fixed bottom-28 right-6 w-14 h-14 bg-cyan-500 rounded-2xl shadow-2xl flex items-center justify-center text-2xl z-40">🧠</button>
        
        <div id="chat-window" class="glass border border-white/10 flex flex-col shadow-2xl">
            <div class="p-5 border-b border-white/5 flex justify-between items-center bg-white/5">
                <span class="text-[10px] font-black uppercase tracking-widest text-cyan-500">Nexus Advisor AI</span>
                <button onclick="toggleChat()" class="text-slate-500 text-sm font-black">✕</button>
            </div>
            <div id="chat-messages">
                <div class="msg msg-ia">Sócio, o sistema está 100% calibrado. Qual o objetivo de hoje?</div>
            </div>
            <div class="p-4 bg-black border-t border-white/5 flex gap-2">
                <input id="chat-input" type="text" placeholder="Comando..." class="flex-1 bg-white/5 p-4 rounded-2xl text-xs outline-none text-white" onkeypress="if(event.key==='Enter') enviarMensagemChat()">
                <button onclick="enviarMensagemChat()" class="bg-cyan-500 px-5 rounded-2xl text-black font-black">➤</button>
            </div>
        </div>

        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] h-20 glass rounded-[2.5rem] z-50 flex items-center justify-around shadow-2xl border border-white/5">
            <button onclick="nav(event, 'dash')" class="nav-active flex flex-col items-center gap-1.5"><span class="text-2xl">👤</span><span class="text-[8px] font-black uppercase">Bio</span></button>
            <button onclick="nav(event, 'treinos')" class="text-slate-500 flex flex-col items-center gap-1.5"><span class="text-2xl">💪</span><span class="text-[8px] font-black uppercase">Ação</span></button>
            <button onclick="nav(event, 'hub')" class="text-slate-500 flex flex-col items-center gap-1.5"><span class="text-2xl">🌍</span><span class="text-[8px] font-black uppercase">Hub</span></button>
        </nav>
    </div>

    <script>
        const CHAVE_CORRETA = "Nexus2026";
        let db;

        function init() {
            const data = localStorage.getItem('Nexus_Gold_DB');
            db = data ? JSON.parse(data) : { xp: 0, unlocked: false, weight: '75', meta: 'Bulking', nexusId: 'NX-'+Math.floor(1000+Math.random()*9000)+'-F' };
        }

        function save() { localStorage.setItem('Nexus_Gold_DB', JSON.stringify(db)); }

        window.addEventListener('load', () => {
            init();
            if(!db.unlocked) document.getElementById('alpha-lock').classList.remove('hidden');
            else startApp();
        });

        function verificarChave() {
            if(document.getElementById('alpha-key').value.trim() === CHAVE_CORRETA) {
                db.unlocked = true; save();
                runBoot();
            } else { showToast("CHAVE INVÁLIDA", "#ef4444"); }
        }

        function runBoot() {
            document.getElementById('alpha-lock').classList.add('hidden');
            const boot = document.getElementById('boot-screen');
            const text = document.getElementById('boot-text');
            boot.style.display = 'flex';
            const lines = ["> DESCRIPTOGRAFANDO...", "> SINCRONIZANDO SATÉLITES...", "> ACESSANDO NÚCLEO NEURAL...", "> PROTOCOLO SOVEREIGN ATIVO..."];
            let i = 0;
            const int = setInterval(() => {
                text.innerHTML += lines[i] + "<br>";
                i++;
                if(i >= lines.length) {
                    clearInterval(int);
                    setTimeout(() => { boot.style.display = 'none'; startApp(); }, 800);
                }
            }, 400);
        }

        function startApp() {
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('u-weight').value = db.weight;
            document.getElementById('u-meta').value = db.meta;
            document.getElementById('nexus-id-display').innerText = `ID: ${db.nexusId}`;
            atualizarUI();
        }

        function completeMission(btn) {
            btn.innerHTML = "✓"; btn.disabled = true; btn.classList.replace('bg-cyan-500', 'bg-slate-800');
            db.xp += 1000; save(); atualizarUI(); showToast("+1000 XP - HIDRATAÇÃO");
        }

        function showToast(m, c="#06b6d4") {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.background = c; t.style.top = '30px';
            setTimeout(() => t.style.top = '-100px', 2500);
        }

        function atualizarUI() {
            document.getElementById('xp-display').innerText = `${db.xp.toLocaleString()} XP`;
            document.getElementById('xp-bar').style.width = (db.xp % 100) + "%";
            renderRank();
        }

        function toggleChat() {
            const w = document.getElementById('chat-window');
            w.style.display = (w.style.display === 'flex') ? 'none' : 'flex';
        }

        function enviarMensagemChat() {
            const input = document.getElementById('chat-input');
            const userMsg = input.value.trim();
            if(!userMsg) return;
            addMsg(userMsg, 'user');
            input.value = '';
            setTimeout(() => {
                const peso = parseFloat(db.weight);
                const meta = db.meta;
                const msg = userMsg.toLowerCase();
                let r = "";
                if(msg.includes("dieta")) {
                    r = `Análise para **${peso}kg** (**${meta}**):<br><div class="planilha-box">META: ${meta === 'Bulking' ? peso*38 : peso*28} kcal<br>PROT: ${Math.round(peso*2.2)}g<br>Base: Arroz, Frango e Ovos.</div>`;
                } else if(msg.includes("treino")) {
                    r = `Protocolo **${meta}** Gerado:<br><div class="planilha-box">A: Supino / Militar<br>B: Barra Fixa / Remada<br>C: Agachamento / Leg</div>`;
                } else { r = "Sistema online. Peça sua **Dieta** ou **Treino**."; }
                addMsg(r, 'ia');
            }, 800);
        }

        function addMsg(t, s) {
            const box = document.getElementById('chat-messages');
            const d = document.createElement('div');
            d.className = `msg msg-${s}`;
            d.innerHTML = t;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        function gerarProtocolo() {
            const card = document.getElementById('bio-card');
            card.classList.add('scanning');
            showToast("PROCESSANDO...");
            setTimeout(() => {
                card.classList.remove('scanning');
                const list = document.getElementById('lista-exercicios');
                list.innerHTML = `<h3 class="text-[10px] font-black text-cyan-500 uppercase mb-6 italic">Ação Imediata</h3>`;
                [{n:'Supino Alpha', s:'4x10'}, {n:'Terra Sovereign', s:'3x5'}].forEach(ex => {
                    list.innerHTML += `<div class="glass p-6 rounded-[2.5rem] flex justify-between items-center mb-4 border-l-4 border-cyan-500"><div><p class="font-black text-xs text-white">${ex.n}</p><p class="text-[8px] text-slate-500 uppercase">${ex.s}</p></div><button onclick="addXP(this, 500)" class="w-12 h-12 bg-cyan-500 rounded-xl font-black text-black shadow-lg">⚡</button></div>`;
                });
                nav(null, 'treinos');
            }, 1500);
        }

        function addXP(btn, v) {
            db.xp += v; save(); atualizarUI();
            btn.innerHTML = "✓"; btn.disabled = true;
            showToast(`+${v} XP ADQUIRIDO`);
        }

        function nav(e, tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            if(e) {
                document.querySelectorAll('nav button').forEach(b => b.classList.replace('nav-active', 'text-slate-500'));
                e.currentTarget.classList.add('nav-active');
            }
        }

        function renderRank() {
            const r = [{n:'Sovereign', x:500000}, {n:'User_'+db.nexusId, x:db.xp}].sort((a,b)=>b.x-a.x);
            document.getElementById('leaderboard').innerHTML = `<p class="text-[7px] font-black uppercase text-slate-700 mb-2">Ranking Global</p>` + 
                r.map((u, i) => `<div class="bg-white/5 p-4 rounded-2xl flex justify-between text-[10px] font-bold"><span>#${i+1} ${u.n}</span><span class="text-cyan-500">${u.x.toLocaleString()} XP</span></div>`).join('');
        }

        document.getElementById('u-weight').onchange = (e) => { db.weight = e.target.value; save(); };
        function postar() { 
            const i = document.getElementById('msg-input');
            if(!i.value) return;
            document.getElementById('feed').innerHTML = `<div class='glass p-5 rounded-3xl text-xs border-l-2 border-cyan-500 mb-4'><p class='font-black text-cyan-400 text-[8px]'>${db.nexusId}</p>${i.value}</div>` + document.getElementById('feed').innerHTML;
            i.value = ''; showToast("ENVIADO");
        }
    </script>
</body>
                                </html>
