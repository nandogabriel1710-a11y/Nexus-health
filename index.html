<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>NEXUS - THE SYSTEM v25.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --system-blue: #00f2ff; --system-purple: #7000ff; --bg-dark: #020617; }
        body { background: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
        .font-system { font-family: 'Orbitron', sans-serif; }
        .hud-border { border: 1px solid rgba(0, 242, 255, 0.3); box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.1); }
        .glass { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); }
        
        /* ITEM RARITY COLORS */
        .item-rare { border-left: 4px solid #7000ff; background: linear-gradient(90deg, rgba(112,0,255,0.1), transparent); }
        .item-legendary { border-left: 4px solid #fbbf24; background: linear-gradient(90deg, rgba(251,191,36,0.1), transparent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 50000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--system-blue); }
    </style>
</head>
