<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS - THE SYSTEM v30.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --system-blue: #00f2ff; --bg-dark: #020617; }
        body { background: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
        .font-system { font-family: 'Orbitron', sans-serif; }
        .hud-border { border: 1px solid rgba(0, 242, 255, 0.2); box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.05); }
        .glass { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Cores de Rank */
        .rank-E { color: #94a3b8; text-shadow: 0 0 5px #94a3b8; border-color: #94a3b8; }
        .rank-D { color: #f8fafc; text-shadow: 0 0 5px #f8fafc; border-color: #f8fafc; }
        .rank-C { color: #4ade80; text-shadow: 0 0 5px #4ade80; border-color: #4ade80; }
        .rank-B { color: #60a5fa; text-shadow: 0 0 10px #2563eb; border-color: #2563eb; }
        .rank-A { color: #c084fc; text-shadow: 0 0 10px #9333ea; border-color: #9333ea; }
        .rank-S { color: #facc15; text-shadow: 0 0 15px #ca8a04; border-color: #facc15; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .ai-msg { border-left: 2px solid var(--system-blue); padding: 10px; background: rgba(0, 242, 255, 0.05); border-radius: 0 10px 10px 0; margin-bottom: 10px; white-space: pre-line; font-size: 11px; }
        .user-msg { text-align: right; color: #94a3b8; margin-bottom: 5px; font-weight: bold; font-size: 10px; }
    </style>
</head>
<body class="pb-32">

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[70000] bg-cyan-500 text-black px-6 py-2 rounded-full font-black text-[10px] uppercase hidden shadow-[0_0_20px_rgba(6,182,212,0.4)]"></div>

    <div id="boot-screen" class="fixed inset-0 bg-black z-[60000] flex flex-col items-center justify-center text-cyan-500">
        <div class="font-system text-xs tracking-[0.5em] mb-4 animate-pulse">NEXUS2026</div>
        <div id="boot-log" class="text-[10px] font-mono opacity-50 h-4 uppercase">Sincronizando Banco de Dados...</div>
    </div>

    <div id="main-app" class="hidden">
        <header class="p-6 sticky top-0 z-50 glass border-b border-cyan-500/20 flex justify-between items-start">
            <div>
                <h1 class="font-system text-lg font-black tracking-tighter text-white">NEXUS<span class="text-cyan-500">2026</span></h1>
                <div class="flex items-center gap-3 mt-1">
                    <div id="rank-badge" class="w-8 h-8 rounded border flex items-center justify-center font-system font-black text-lg rank-E">E</div>
                    <div>
                        <span class="text-[10px] font-bold font-system text-slate-400 uppercase">Level <span id="display-lvl">1</span></span>
                        <div class="w-24 h-1.5 bg-slate-800 rounded-full mt-1 overflow-hidden">
                            <div id="xp-bar" class="h-full bg-cyan-400 transition-all duration-700"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <p id="display-gold" class="text-yellow-500 font-system font-bold text-sm">0 G</p>
                <button onclick="confirmReset()" class="text-[8px] text-slate-600 uppercase mt-2 block ml-auto">⚙️ Reset System</button>
            </div>
        </header>

        <main class="p-6 space-y-6">
            <section id="status" class="tab-content active space-y-6">
                <div class="hud-border p-5 rounded-2xl glass grid grid-cols-3 gap-2 text-center">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                        <p class="text-[7px] text-slate-500 uppercase">Força</p>
                        <p id="stat-str" class="text-xl font-bold">10</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                        <p class="text-[7px] text-slate-500 uppercase">Agilidade</p>
                        <p id="stat-agi" class="text-xl font-bold">10</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                        <p class="text-[7px] text-slate-500 uppercase">Vitalidade</p>
                        <p id="stat-vit" class="text-xl font-bold">10</p>
                    </div>
                </div>

                <div class="hud-border p-6 rounded-3xl border-purple-500/30">
                    <h3 class="font-system text-[9px] text-purple-400 mb-4 uppercase">Missão do Dia</h3>
                    <div id="quest-item" class="flex justify-between items-center bg-purple-500/10 p-4 rounded-xl border-l-4 border-purple-500">
                        <span id="quest-title" class="text-xs font-bold uppercase tracking-tight">Completar Treino Diário</span>
                        <button id="btn-quest" onclick="completeDaily()" class="bg-cyan-500 text-black px-4 py-1 rounded-lg font-black text-[9px]">CONCLUIR</button>
                    </div>
                </div>
            </section>

            <section id="market" class="tab-content space-y-4">
                <h2 class="font-system text-[10px] text-yellow-500 tracking-widest uppercase">[ Inventário da Loja ]</h2>
                <div id="market-list" class="space-y-4"></div>
            </section>

            <section id="guild" class="tab-content space-y-4">
                <h2 class="font-system text-[10px] text-cyan-500 tracking-widest uppercase">[ Ranking Global ]</h2>
                <div class="glass p-4 rounded-xl border border-white/5 flex items-center gap-4">
                    <div class="w-10 h-10 bg-yellow-500 rounded-full flex items-center justify-center font-bold text-black text-xs font-system">S</div>
                    <div>
                        <p class="text-xs font-bold">Socio_Monarca <span class="text-[9px] text-yellow-500 ml-2">LVL 99</span></p>
                        <p class="text-[9px] text-slate-500 italic">"O segredo é não pular o treino de perna."</p>
                    </div>
                </div>
            </section>
        </main>

        <div id="chat-window" class="fixed inset-x-4 bottom-24 h-[60vh] glass hud-border hidden flex-col z-[100] rounded-3xl overflow-hidden border-cyan-500/40">
            <div class="p-4 border-b border-cyan-500/20 bg-cyan-500/10 flex justify-between items-center">
                <span class="font-system text-[9px] text-cyan-400 tracking-widest">NEXUS AI v3.0</span>
                <button onclick="toggleChat()" class="text-slate-500">✕</button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 font-mono space-y-4"></div>
            <div class="p-4 bg-black/40 flex gap-2">
                <input id="chat-input" placeholder="Pergunte sobre treinos ou dietas..." class="flex-1 bg-transparent outline-none text-xs text-white">
                <button onclick="askAI()" class="text-cyan-500 font-system text-[10px] font-bold">ENVIAR</button>
            </div>
        </div>

        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] h-16 glass hud-border rounded-full flex items-center justify-around z-50">
            <button onclick="nav('status')" class="text-cyan-500 nav-btn">👤</button>
            <button onclick="nav('market')" class="text-slate-500 nav-btn">⚖️</button>
            <button onclick="toggleChat()" id="ai-trigger" class="w-14 h-14 bg-cyan-500 rounded-full -mt-10 shadow-[0_0_20px_#00f2ff] flex items-center justify-center text-2xl">🧠</button>
            <button onclick="nav('guild')" class="text-slate-500 nav-btn">🛡️</button>
        </nav>
    </div>

    <script>
        let db;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const KNOWLEDGE = {
            workouts: {
                peito: "⚔️ PROTOCOLO PEITORAL:\n1. Supino Reto: 4x10\n2. Inclinado: 3x12\n3. Crossover: 3x15\nDica: Mantenha os ombros para trás.",
                costas: "⚔️ PROTOCOLO DORSAL:\n1. Puxada Alta: 4x10\n2. Remada Baixa: 4x12\n3. Barra Fixa: 3x Falha",
                perna: "⚔️ PROTOCOLO INFERIOR:\n1. Agachamento: 4x10\n2. Leg Press: 3x15\n3. Extensora: 4x12"
            },
            diets: {
                emagrecer: "🥗 DIETA DE DEFINIÇÃO (CUTTING):\n• 2.0g Prot/kg | 1.5g Carb/kg\n• Café: Ovos e Aveia\n• Almoço: Frango, Legumes e 100g Arroz\n• Janta: Peixe e Salada.",
                massa: "🥩 DIETA DE GANHO (BULKING):\n• 2.0g Prot/kg | 4.0g Carb/kg\n• Café: Ovos, Pão e Banana\n• Almoço: Carne, Feijão e 250g Arroz\n• Janta: Macarrão com Frango."
            }
        };

        function playSound(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function init() {
            const saved = localStorage.getItem('Nexus_v30_Final');
            db = saved ? JSON.parse(saved) : { lvl: 1, xp: 0, nextLvl: 1000, str: 10, agi: 10, vit: 10, gold: 100, lastQuestDate: "" };
        }

        function save() { localStorage.setItem('Nexus_v30_Final', JSON.stringify(db)); }

        function getRankInfo(lvl) {
            if(lvl >= 50) return { r: 'S', c: 'rank-S' };
            if(lvl >= 40) return { r: 'A', c: 'rank-A' };
            if(lvl >= 30) return { r: 'B', c: 'rank-B' };
            if(lvl >= 20) return { r: 'C', c: 'rank-C' };
            if(lvl >= 10) return { r: 'D', c: 'rank-D' };
            return { r: 'E', c: 'rank-E' };
        }

        function updateUI() {
            document.getElementById('display-lvl').innerText = db.lvl;
            document.getElementById('display-gold').innerText = `${db.gold} G`;
            document.getElementById('stat-str').innerText = db.str;
            document.getElementById('stat-agi').innerText = db.agi;
            document.getElementById('stat-vit').innerText = db.vit;
            document.getElementById('xp-bar').style.width = ((db.xp / db.nextLvl) * 100) + "%";

            const rank = getRankInfo(db.lvl);
            const badge = document.getElementById('rank-badge');
            badge.innerText = rank.r;
            badge.className = `w-8 h-8 rounded border flex items-center justify-center font-system font-black text-lg ${rank.c}`;

            const today = new Date().toISOString().split('T')[0];
            const btn = document.getElementById('btn-quest');
            if(db.lastQuestDate === today) {
                btn.disabled = true;
                btn.innerText = "CONCLUÍDO";
                document.getElementById('quest-item').classList.replace('border-purple-500', 'border-slate-500');
            }

            if(db.xp >= db.nextLvl) {
                db.lvl++; db.xp = 0; db.nextLvl *= 1.3;
                playSound(600, 'square', 0.4);
                showToast("SISTEMA: LEVEL UP!");
                save(); updateUI();
            }
        }

        function completeDaily() {
            const today = new Date().toISOString().split('T')[0];
            if(db.lastQuestDate === today) return;
            playSound(400, 'sine', 0.1);
            db.gold += 250; db.xp += 500;
            db.lastQuestDate = today;
            showToast("MISSÃO CONCLUÍDA! +500 XP");
            save(); updateUI();
        }

        function askAI() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim().toLowerCase();
            if(!msg) return;
            playSound(800, 'sine', 0.05);
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="user-msg">[HUNTER]: ${input.value}</div>`;
            input.value = '';

            setTimeout(() => {
                let reply = "[SISTEMA]: Comando desconhecido. Tente 'Treino de Peito' ou 'Dieta para Massa'.";
                if(msg.includes('peito')) reply = KNOWLEDGE.workouts.peito;
                else if(msg.includes('costa')) reply = KNOWLEDGE.workouts.costas;
                else if(msg.includes('perna')) reply = KNOWLEDGE.workouts.perna;
                else if(msg.includes('emagrecer') || msg.includes('secar')) reply = KNOWLEDGE.diets.emagrecer;
                else if(msg.includes('massa') || msg.includes('bulking')) reply = KNOWLEDGE.diets.massa;
                
                box.innerHTML += `<div class="ai-msg font-mono text-cyan-400">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 400);
        }

        function confirmReset() {
            if(confirm("Deseja apagar todos os dados do Sistema?")) {
                localStorage.removeItem('Nexus_v30_Final');
                location.reload();
            }
        }

        function nav(id) {
            playSound(200, 'sine', 0.05);
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-cyan-500', 'text-slate-500'));
            event.currentTarget.classList.replace('text-slate-500', 'text-cyan-500');
        }

        function toggleChat() {
            playSound(500, 'sine', 0.05);
            const chat = document.getElementById('chat-window');
            chat.style.display = (chat.style.display === 'flex') ? 'none' : 'flex';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        function renderShop() {
            const list = [
                { id: 1, name: 'Creatina Monarca', price: 400, icon: '🧪', buff: 'str', desc: '+2 Força' },
                { id: 2, name: 'Whey de Yggdrasil', price: 350, icon: '🥤', buff: 'vit', desc: '+2 Vitalidade' }
            ];
            document.getElementById('market-list').innerHTML = list.map(item => `
                <div class="hud-border p-4 rounded-2xl glass flex justify-between items-center border-white/5">
                    <div class="flex items-center gap-4"><span class="text-2xl">${item.icon}</span><div><p class="text-xs font-bold uppercase">${item.name}</p><p class="text-[8px] text-slate-400">${item.desc}</p></div></div>
                    <button onclick="buyItem(${item.price}, '${item.buff}')" class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-black text-[9px]">${item.price}G</button>
                </div>`).join('');
        }

        function buyItem(price, buff) {
            if(db.gold >= price) { 
                db.gold -= price; db[buff] += 2; 
                playSound(1000, 'sine', 0.1);
                save(); updateUI(); showToast("ITEM EQUIPADO!"); 
            } else showToast("OURO INSUFICIENTE");
        }

        document.addEventListener('DOMContentLoaded', () => {
            init();
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                renderShop();
                updateUI();
            }, 800);
        });
    </script>
</body>
</html>
